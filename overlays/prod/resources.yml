# superapp2's replicas and memory limit in prod: the base sets one replica and no memory limit. Three replicas
# keep each pod under NORMAL_MAX_RPS at the load superapp sends.
# 768Mi rather than the previous 384Mi (256Mi and 128Mi before that): superapp2's steady working set is
# ~17-19MiB, but it spikes far above that in bursts. It was OOMKilled three times in ten minutes at 128Mi (and in
# earlier runs at 256Mi and 384Mi) with the kernel killing it exactly at the limit, so the limit is doubled rather
# than nudged. The request is raised with it (128Mi -> 256Mi), so the steady working set has real headroom reserved.
# 768Mi rather than 1Gi: the Node has ~2.6GiB of allocatable headroom beyond the current requests, which is
# plenty for 3 pods x (512 - 128)Mi of extra limit, and 1Gi per pod would leave less for the rest of the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superapp2
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: superapp2
          resources:
            requests: { memory: 256Mi }
            limits: { memory: 768Mi }
